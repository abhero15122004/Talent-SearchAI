# ===================================================================
# TalentMatch AI - Standalone Dev Profile (In-Memory Database)
# Launch with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ===================================================================

spring.datasource.url=jdbc:h2:mem:talentmatch_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Enable safe development initialization of Admin & Recruiter accounts
app.security.init-dev-data=true
