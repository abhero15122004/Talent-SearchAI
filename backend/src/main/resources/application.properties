# ===================================================================
# TalentMatch AI Backend Configuration
# ===================================================================

spring.application.name=talentmatch-backend
server.port=${SERVER_PORT:8080}

# Optional import of local gitignored environment files (.env or application-local.properties)
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:./src/main/resources/application-local.properties,optional:file:../src/main/resources/application-local.properties

# ===================================================================
# MySQL Relational Database Configuration
# Overridable via local .env, environment variables, or application-local.properties
# ===================================================================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/talentmatch_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:talentmatch_app}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# Flyway Database Migrations
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Hibernate & JPA Configuration
# Note: 'validate' ensures JPA entity mappings strictly match Flyway DDL
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Security & JWT Configuration
# In production, JWT_SECRET must be supplied via a secure environment variable
# ===================================================================
app.jwt.secret=${JWT_SECRET:${APP_SECURITY_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration - Strict whitelist of origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===================================================================
# Resume Ingestion & Storage Configuration
# ===================================================================
app.ingestion.storage-dir=${STORAGE_DIR:./storage/resumes}
app.ingestion.max-file-size=${MAX_FILE_SIZE:15728640}
app.ingestion.max-archive-size=${MAX_ARCHIVE_SIZE:104857600}
app.ingestion.max-decompressed-size=${MAX_DECOMPRESSED_SIZE:209715200}
app.ingestion.max-files-per-batch=${MAX_FILES_PER_BATCH:500}

# Multipart upload limits (allow up to 100MB archive)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB

# Tomcat Embedded Server Multipart & Part Count Configuration
# Prevents FileCountLimitExceededException during bulk resume folder ingestion (up to 500 files/parts)
server.tomcat.max-part-count=${TOMCAT_MAX_PART_COUNT:500}
server.tomcat.max-part-header-size=${TOMCAT_MAX_PART_HEADER_SIZE:4096}
server.tomcat.max-http-form-post-size=${TOMCAT_MAX_HTTP_FORM_POST_SIZE:120MB}
server.tomcat.max-swallow-size=120MB

# Bounded Async Task Executor Configuration
app.async.resume-core-pool-size=4
app.async.resume-max-pool-size=8
app.async.resume-queue-capacity=200

# Development-only Data Initialization Flag (never true by default in prod)
app.security.init-dev-data=${INIT_DEV_DATA:false}

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ===================================================================
# AI NLP & Semantic Matching Service Configuration
# ===================================================================
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
app.ai-service.api-key=${AI_SERVICE_KEY:tm-internal-secret-key-prod-2026}
app.ai-service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:15000}
app.ai-service.enabled=${AI_SERVICE_ENABLED:true}

