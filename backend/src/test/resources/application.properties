# ===================================================================
# TalentMatch AI - Automated Test Configuration
# Uses In-Memory H2 Database with Flyway migrations & schema validation
# ===================================================================

spring.application.name=talentmatch-test

spring.datasource.url=jdbc:h2:mem:talentmatch_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Verify Flyway migrations run successfully in tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Validate that JPA entity mappings match Flyway DDL exactly
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Secret
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

# Do not auto-initialize dev accounts in automated test suite
app.security.init-dev-data=false

# Ingestion configuration for tests
app.ingestion.storage-dir=./target/test-storage/resumes
app.ingestion.max-file-size=15728640
app.ingestion.max-archive-size=104857600
app.ingestion.max-decompressed-size=209715200
app.ingestion.max-files-per-batch=100
app.async.resume-core-pool-size=2
app.async.resume-max-pool-size=4
app.async.resume-queue-capacity=50

logging.level.root=WARN
logging.level.com.talentmatch=INFO
